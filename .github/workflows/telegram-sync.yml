name: Telegram Media Sync Worker

on:
  workflow_dispatch:
    inputs:
      series_name:
        description: 'Series Name pattern (e.g. Cukurova, Kizilcik, Yali)'
        required: true
        default: 'Cukurova'
      target_channel:
        description: 'Target Channel Username/ID (e.g. rozgarani)'
        required: true
        default: 'rozgarani'
      batch_limit:
        description: 'Number of episodes to process in this run'
        required: false
        default: '2'

jobs:
  sync_media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install telethon cryptg

      - name: Run Cloner Engine
        env:
          TG_API_ID: "21151830"
          TG_API_HASH: "c1fcbe3a33387389f44872a4ae07e804"
          TG_STRING_SESSION: "${{ secrets.TG_STRING_SESSION }}"
          SERIES_NAME: "${{ github.event.inputs.series_name }}"
          TARGET_CHANNEL: "${{ github.event.inputs.target_channel }}"
          BATCH_LIMIT: "${{ github.event.inputs.batch_limit }}"
        run: |
          python sync_worker.py
